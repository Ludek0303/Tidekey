<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd plików — makiety</title>
<!-- Prawdziwe zmienne motywu aplikacji. Klasy .podglad-* to wzór dla ui/src/preview/preview.css. -->
<link rel="stylesheet" href="../../../ui/src/tokens.css">
<style>
  /* ---- strona makiet (nie wchodzi do aplikacji) ---- */
  body { margin: 0; padding: 24px; background: var(--ribbon); color: var(--text); font: var(--ui-font-size)/1.45 var(--font-ui); }
  .makieta-naglowek { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1400px; margin: 0 auto 20px; }
  .makieta-naglowek h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .makiety { display: grid; grid-template-columns: repeat(auto-fill, minmax(620px, 1fr)); gap: 28px; max-width: 1400px; margin: 0 auto; }
  figure { margin: 0; }
  figcaption { margin: 0 0 8px; color: var(--muted); }
  .ekran { position: relative; height: 420px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
    background: var(--editor-bg); }
  .ekran.waski { width: 375px; height: 660px; }
  .aplikacja-pod { position: absolute; inset: 0; padding: 24px 32px; color: var(--muted); }
  .aplikacja-pod p { margin: 0 0 10px; max-width: 46ch; }

  /* ---- okno podglądu: wzór dla preview.css ---- */
  .podglad {
    --podglad-tlo: var(--overlay);
    --podglad-okno: var(--bg);
    --podglad-pasek: var(--panel);
    --podglad-krawedz: var(--border);
    --podglad-tekst: var(--text);
    --podglad-opis: var(--muted);
    --podglad-akcent: var(--accent);
    --podglad-karta: var(--editor-bg);
    --podglad-postep: var(--accent);
    --podglad-blad: var(--danger);
    --podglad-promien: var(--radius-panel);
    --podglad-czas: 120ms;
    position: absolute; /* w aplikacji: fixed */
    inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px;
    background: var(--podglad-tlo);
  }
  .podglad-okno {
    width: min(1200px, 100%); height: min(860px, 100%); display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr);
    background: var(--podglad-okno); color: var(--podglad-tekst);
    border: 1px solid var(--podglad-krawedz); border-radius: var(--podglad-promien); overflow: hidden;
    box-shadow: var(--shadow-float);
  }
  .podglad-pasek {
    display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 8px 0 14px;
    background: var(--podglad-pasek); border-bottom: 1px solid var(--podglad-krawedz);
  }
  .podglad-ikona { flex: none; width: 18px; height: 18px; color: var(--podglad-opis); }
  .podglad-nazwa { min-width: 0; display: flex; flex-direction: column; flex: 1 1 auto; }
  .podglad-nazwa strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .podglad-opis { color: var(--podglad-opis); font-size: 12px; }
  .podglad-nav { display: flex; align-items: center; gap: 2px; color: var(--podglad-opis); font-variant-numeric: tabular-nums; }
  .podglad-licznik { min-width: 52px; text-align: center; font-size: 12px; }
  .podglad-akcje { display: flex; align-items: center; gap: 4px; }
  .podglad-przycisk {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
    background: transparent; color: var(--podglad-tekst); border: 1px solid transparent; border-radius: var(--radius-sm);
    font: inherit; cursor: pointer;
  }
  .podglad-przycisk:hover { background: var(--hover); }
  .podglad-przycisk:focus-visible { outline: 2px solid var(--podglad-akcent); outline-offset: 1px; }
  .podglad-przycisk.tylko-ikona { width: 32px; padding: 0; justify-content: center; }
  .podglad-przycisk svg { width: 16px; height: 16px; }
  .podglad-przycisk[disabled] { opacity: .4; cursor: default; }
  .podglad-separator { width: 1px; height: 20px; background: var(--podglad-krawedz); margin: 0 4px; }
  .podglad-tresc { position: relative; min-height: 0; overflow: hidden; }
  .podglad-ramka { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--podglad-okno); }
  .podglad-wiecej { display: none; }
  /* węższe okno: same ikony (nazwa przycisku zostaje w aria-label i dymku) */
  .podglad-okno { container-type: inline-size; }
  @container (max-width: 760px) {
    .podglad-etykieta { display: none; }
    .podglad-przycisk.pelne { width: 32px; padding: 0; justify-content: center; }
    .podglad-nav { gap: 0; }
    .podglad-licznik { min-width: 44px; }
  }

  /* stany: rysuje aplikacja */
  .podglad-stan { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  .podglad-karta {
    width: min(420px, 100%); padding: 28px 24px 22px; display: grid; justify-items: center; gap: 10px;
    background: var(--podglad-karta); border: 1px solid var(--podglad-krawedz); border-radius: var(--radius-panel);
  }
  .podglad-karta .duza-ikona { width: 44px; height: 44px; color: var(--podglad-opis); }
  .podglad-karta h2 { margin: 4px 0 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .podglad-karta p { margin: 0; color: var(--podglad-opis); }
  .podglad-karta .akcje { display: flex; gap: 8px; margin-top: 8px; }
  .podglad-karta.is-blad h2 { color: var(--podglad-tekst); }
  .podglad-karta.is-blad .duza-ikona { color: var(--podglad-blad); }
  .podglad-postep { width: 260px; height: 4px; border-radius: 2px; background: var(--podglad-krawedz); overflow: hidden; }
  .podglad-postep > span { display: block; height: 100%; background: var(--podglad-postep); }
  .podglad-ladowanie { display: grid; justify-items: center; gap: 10px; color: var(--podglad-opis); font-variant-numeric: tabular-nums; }
  .btn { min-height: 34px; padding: 6px 14px; border-radius: var(--radius-control); background: var(--panel); color: var(--text); border: 1px solid var(--border); font: inherit; cursor: pointer; }
  .btn-primary { background: var(--accent-solid); color: var(--on-accent); border-color: var(--accent-solid); }

  /* wąskie okno */
  .ekran.waski .podglad { padding: 0; }
  .ekran.waski .podglad-okno { border-radius: 0; border: 0; width: 100%; height: 100%; }
  .ekran.waski .podglad-nav, .ekran.waski .podglad-akcje .pelne, .ekran.waski .podglad-separator, .ekran.waski .podglad-opis { display: none; }
  .ekran.waski .podglad-wiecej { display: inline-flex; }

  /* ---- treść w ramce (rysuje ramka; tu tylko wygląd) ---- */
  .r { position: absolute; inset: 0; background: var(--bg); color: var(--text); }
  .r-narzedzia { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px;
    padding: 3px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; box-shadow: var(--shadow-sm); }
  .r-narzedzia button { height: 28px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text); font: inherit; }
  .r-narzedzia button:hover { background: var(--hover); }
  .r-narzedzia .wart { padding: 0 6px; min-width: 64px; text-align: center; }
  .r-obraz { display: grid; place-items: center; height: 100%; }
  .r-obraz svg { max-width: 82%; max-height: 82%; border-radius: 2px; box-shadow: 0 1px 0 #0003; }
  .r-pdf { height: 100%; overflow: hidden; display: grid; justify-items: center; align-content: start; gap: 14px; padding-top: 18px; background: color-mix(in srgb, var(--bg) 70%, #000); }
  .kartka { width: 300px; height: 390px; background: #fff; color: #222; border-radius: 2px; box-shadow: 0 2px 10px #0006; padding: 28px 30px; box-sizing: border-box; font: 9px/1.5 Georgia, serif; }
  .kartka h3 { font: 600 13px/1.3 Georgia, serif; margin: 0 0 8px; }
  .kartka .linia { height: 5px; background: #d9d9d9; margin: 6px 0; border-radius: 1px; }
  .r-arkusz { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; }
  .siatka { overflow: hidden; font-size: 12px; font-variant-numeric: tabular-nums; }
  .siatka table { border-collapse: collapse; }
  .siatka th, .siatka td { border: 1px solid var(--border); padding: 3px 8px; height: 18px; white-space: nowrap; text-align: left; }
  .siatka th { background: var(--panel); color: var(--muted); font-weight: 500; position: sticky; top: 0; }
  .siatka th.w { text-align: center; width: 34px; }
  .siatka td.n { text-align: right; }
  .zakladki { display: flex; gap: 2px; padding: 4px 8px; border-top: 1px solid var(--border); background: var(--panel); }
  .zakladki span { padding: 4px 12px; border-radius: 6px; color: var(--muted); }
  .zakladki span.akt { background: var(--bg); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  .r-slajdy { position: absolute; inset: 0; display: grid; grid-template-columns: 132px 1fr; }
  .miniatury { border-right: 1px solid var(--border); padding: 10px; display: grid; gap: 10px; align-content: start; overflow: hidden; background: var(--panel); }
  .miniatury div { aspect-ratio: 16/9; background: #fff; border-radius: 3px; border: 2px solid transparent; position: relative; }
  .miniatury div.akt { border-color: var(--accent); }
  .miniatury div b { position: absolute; left: -2px; top: -2px; font: 10px var(--font-ui); color: var(--muted); transform: translateX(-130%); }
  .slajd-duzy { display: grid; place-items: center; padding: 24px; }
  .slajd { width: 100%; max-width: 560px; aspect-ratio: 16/9; background: linear-gradient(160deg, #26324a, #13192a); color: #fff; border-radius: 4px; box-shadow: 0 2px 12px #0006; padding: 34px; box-sizing: border-box; }
  .slajd h3 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
  .slajd li { margin: 4px 0; font-size: 13px; color: #d7dcea; }
  .r-kod { position: absolute; inset: 0; font: 12.5px/1.6 ui-monospace, "JetBrains Mono", monospace; display: grid; grid-template-columns: 48px 1fr; overflow: hidden; }
  .r-kod .nr { color: var(--muted); opacity: .6; text-align: right; padding: 10px 10px 0 0; border-right: 1px solid var(--border); white-space: pre; }
  .r-kod pre { margin: 0; padding: 10px 14px; white-space: pre; }
  .k { color: var(--accent); } .s { color: var(--success); } .c { color: var(--muted); font-style: italic; } .f { color: #e5c07b; }
  :root[data-theme="light"] .f { color: #8a5d00; }
  .r-3d { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--panel) 100%, #fff 4%), var(--bg)); display: grid; place-items: center; }
  .r-boczne { position: absolute; right: 12px; top: 12px; width: 168px; padding: 8px; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; }
  .r-boczne h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .r-boczne label { display: flex; align-items: center; gap: 6px; padding: 3px 2px; }
  .kolor { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .r-klatka { position: absolute; inset: 0; display: grid; place-items: center; background: #000; }
  .r-klatka svg { width: 80%; }
  .etykieta { position: absolute; left: 14px; top: 14px; padding: 3px 8px; border-radius: 6px; background: #000a; color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: no-preference) {
    .podglad { animation: podglad-wejscie var(--podglad-czas) var(--ease) both; }
    @keyframes podglad-wejscie { from { opacity: 0; } }
  }
</style>
</head>
<body>
<div class="makieta-naglowek">
  <h1>Podgląd plików: makiety okna</h1>
  <button class="btn" type="button" id="motyw">Przełącz motyw</button>
</div>

<!-- ikony (lucide, ISC): symbole używane niżej -->

<template id="pasek">
  <header class="podglad-pasek">
    <svg class="podglad-ikona"><use href="#i-image"/></svg>
    <div class="podglad-nazwa"><strong data-nazwa title="">Plik</strong><span class="podglad-opis" data-opis>Obraz · 2,4 MB</span></div>
    <div class="podglad-nav" data-nav>
      <button class="podglad-przycisk tylko-ikona" type="button" aria-label="Poprzedni plik"><svg><use href="#i-left"/></svg></button>
      <span class="podglad-licznik" data-licznik>3 z 12</span>
      <button class="podglad-przycisk tylko-ikona" type="button" aria-label="Następny plik"><svg><use href="#i-right"/></svg></button>
    </div>
    <span class="podglad-separator"></span>
    <div class="podglad-akcje">
      <button class="podglad-przycisk pelne" type="button" aria-label="Pobierz"><svg><use href="#i-download"/></svg><span class="podglad-etykieta">Pobierz</span></button>
      <button class="podglad-przycisk pelne" type="button" aria-label="Otwórz"><svg><use href="#i-external"/></svg><span class="podglad-etykieta">Otwórz</span></button>
      <button class="podglad-przycisk tylko-ikona podglad-wiecej" type="button" aria-label="Więcej"><svg><use href="#i-more"/></svg></button>
      <button class="podglad-przycisk tylko-ikona" type="button" aria-label="Zamknij"><svg><use href="#i-x"/></svg></button>
    </div>
  </header>
</template>

  <figure data-ikona="i-file-text" data-nazwa="Sprawozdanie roczne 2026 — wersja do podpisu (ostateczna, poprawiona po uwagach zarządu).pdf" data-opis="PDF · 2,4 MB" data-licznik="2 z 19">

  <figure data-ikona="i-sheet" data-nazwa="Budżet działu 2027.xlsx" data-opis="Arkusz · 84 KB" data-licznik="5 z 19">
    <figcaption>XLSX: siatka z nagłówkami kolumn i wierszy, zakładki arkuszy na dole</figcaption>

<script>
  // Jedyny skrypt makiety: przełącznik motywu i wstawienie wspólnego paska.
  const pasek = document.getElementById("pasek");
  for (const fig of document.querySelectorAll("figure")) {
    const slot = fig.querySelector("[data-pasek]");
    const p = pasek.content.cloneNode(true);
    const name = fig.dataset.nazwa;
    // nazwa ucięta w środku: początek…koniec.rozszerzenie
    const dot = name.lastIndexOf(".");
    const ext = dot > 0 ? name.slice(dot) : "";
    const stem = dot > 0 ? name.slice(0, dot) : name;
    const max = fig.querySelector(".waski") ? 22 : 48;
    const short = stem.length + ext.length > max ? stem.slice(0, Math.ceil((max - ext.length - 1) * 0.6)) + "…" + stem.slice(-Math.floor((max - ext.length - 1) * 0.4)) + ext : name;
    p.querySelector("[data-nazwa]").textContent = short;
    p.querySelector("[data-nazwa]").title = name;
    p.querySelector("[data-opis]").textContent = fig.dataset.opis;
    p.querySelector("[data-licznik]").textContent = fig.dataset.licznik;
    p.querySelector(".podglad-ikona use").setAttribute("href", "#" + fig.dataset.ikona);
    slot.replaceWith(p);
  }
  document.getElementById("motyw").addEventListener("click", () => {
    const r = document.documentElement;
    r.dataset.theme = r.dataset.theme === "light" ? "dark" : "light";
  });
</script>
