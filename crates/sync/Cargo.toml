[package]
name = "notes-sync"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[features]
default = []
# shortcut: the browser build has no transport; the desktop app and node enable it
net = ["dep:iroh", "dep:tokio", "dep:iroh-mdns-address-lookup"]
# shortcut: OS keyring is only compiled here, the Tauri app wires it up in stage 3
os-keyring = ["dep:keyring"]

[dependencies]
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8.7"
crypto_box = { version = "0.9.1", default-features = false, features = ["seal", "salsa20", "rand_core"] }
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
iroh = { version = "1.4", optional = true }
iroh-mdns-address-lookup = { version = "0.6.1", optional = true }
keyring = { version = "4.2.0", optional = true }
notes-core = { path = "../core" }
thiserror = "2.0.21"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# getrandom needs its browser backend on wasm32-unknown-unknown (core gets it through another dependency)
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
