[package]
name = "notes-preview"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Parsers for the preview window (docs/PODGLAD.md §2): DWG to DXF, the first video keyframe, old .doc and .ppt"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["dwg"]
dwg = ["dep:acadrust"]

[dependencies]
cfb = "=0.16.0"
serde_json = "1"
# DWG only: it is most of the WASM size, so the frame gets it as a module of its own (feature "dwg", PODGLAD-PLAN §4.5)
acadrust = { version = "=0.6.8", default-features = false, optional = true }
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"
